[workspace]
resolver = "2"
members = [
    "crates/uds-rdma-protocol",
    "crates/uds-rdma-protocol-ffi",
    "crates/urp-cli",
]

# The FFI staticlib must abort on panic (no unwinder in the kernel) and
# strip down to minimum size. Profiles must live at the workspace root.
[profile.release]
panic = "abort"
lto = true
opt-level = "z"
strip = true
