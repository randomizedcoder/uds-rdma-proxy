[package]
name = "urp-bench"
version = "0.1.0"
edition = "2021"
description = "io_uring UDS benchmark (design 30) — Rust twin of tools/urp-bench-core.c"
license = "GPL-2.0-or-later"

# The pure core (design 30 B2) — lib modules — remains dependency-free
# and miri-clean; only the binary (B4: main.rs + uring.rs) uses io-uring
# and libc. The `io-uring` crate is the tokio-rs low-level binding chosen
# in §30.10: raw SQE/CQE parity with liburing, no runtime in between.
[dependencies]
io-uring = "0.7"
libc = "0.2"

[[bin]]
name = "urp-bench"
path = "src/main.rs"
