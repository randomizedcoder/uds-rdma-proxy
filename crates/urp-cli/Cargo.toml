[package]
name = "urp-cli"
version = "0.1.0"
edition = "2021"
description = "Command-line frontend for the urp (UDS-RDMA Proxy) generic netlink family"
license = "GPL-2.0-or-later"

[[bin]]
name = "urp"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
