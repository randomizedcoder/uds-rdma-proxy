# Phase 5 §5.4 — every-push CI.
#
# Runs on GitHub-hosted ubuntu-latest (no KVM, no rdma_rxe). Everything
# here is a pure Nix build against the flake-pinned nixpkgs, so it needs
# nothing from the runner but Nix itself.
#
# The KVM-dependent tiers (MicroVM pair test, sanitizer variant, soak,
# cross-arch full boot) live in nightly.yml on a self-hosted [self-hosted,
# kvm] runner, because GitHub-hosted runners expose no /dev/kvm.
#
# We build explicit flake attrs rather than `nix flake check` on purpose:
# `nix flake check` would also realise the microvm VM packages and the
# KASAN+KMEMLEAK debug kernel (a ~30 min from-scratch kernel build), which
# do not belong in an every-push gate.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix-checks:
    name: Nix checks (unit tests, CLI, kernel-module matrix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Enable Nix binary cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Shared-crate unit tests (protocol, incl. no_std path)
        run: nix build -L .#checks.x86_64-linux.protocol-tests

      - name: CLI build + tests (urp-cli)
        run: nix build -L .#urp-cli

      - name: urp-bench pure-core table tests (design 30 B5)
        run: nix build -L .#checks.x86_64-linux.urp-bench-units

      - name: urp-bench Rust twin tests (design 30 B5)
        run: nix build -L .#checks.x86_64-linux.urp-bench-rs-tests

      # Kernel module build matrix (Phase 5 DoD 7). kernel-module-build is
      # latest mainline; urp-ko-6_* are the supported LTS line. The
      # LINUX_VERSION_CODE / __has_include compat shims in kernel/ are what
      # keep the pre-7.0 builds green.
      - name: Kernel module — latest mainline
        run: nix build -L .#checks.x86_64-linux.kernel-module-build
      - name: Kernel module — 6.1 LTS
        run: nix build -L .#checks.x86_64-linux.urp-ko-6_1
      - name: Kernel module — 6.6 LTS
        run: nix build -L .#checks.x86_64-linux.urp-ko-6_6
      - name: Kernel module — 6.12 LTS
        run: nix build -L .#checks.x86_64-linux.urp-ko-6_12

  fuzz-smoke:
    name: Fuzz smoke (hermetic F1 harnesses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Enable Nix binary cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      # Time-boxed coverage-guided runs of the hermetic userspace harnesses
      # (design 27 F1). These compile the REAL kernel C (urp_frame.c,
      # urp_stream_sm.c) under libFuzzer + ASAN/UBSan -- no VM, no KVM. A crash
      # makes libFuzzer exit non-zero, failing the gate. Any crash reproducer
      # under fuzz/regressions/<target>/ is replayed first so fixed bugs stay
      # fixed. The C reorder backend (needs the pinned kernel.src for the
      # rbtree, a ~140 MB pull) runs in the nightly long-fuzz job instead.
      - name: Replay committed crash reproducers
        run: |
          for t in classify rx-seq bench-deframe; do
            for f in "fuzz/regressions/$t"/*; do
              [ -e "$f" ] || continue   # empty dir (only .gitkeep) -> skip
              # A reproduced crash exits non-zero -> fails the job (set -e).
              nix run ".#fuzz-$t" -- "$f"
            done
          done
      - name: Fuzz classify (RX frame validation, 45s)
        run: nix run .#fuzz-classify -- -max_total_time=45 -print_final_stats=1
      - name: Fuzz rx-seq (RX state-machine pipeline, 45s)
        run: nix run .#fuzz-rx-seq -- -max_total_time=45 -print_final_stats=1
      - name: Fuzz bench-deframe (urp-bench deframer, design 30, 45s)
        run: nix run .#fuzz-bench-deframe -- -max_total_time=45 -print_final_stats=1
