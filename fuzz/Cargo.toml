[package]
name = "uds-rdma-protocol-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.uds-rdma-protocol]
path = "../crates/uds-rdma-protocol"

# urp-bench framing (design 30 §30.12): decode/roundtrip target plus the
# C-vs-Rust differential (build.rs cc-compiles tools/urp-bench-core.c).
[dependencies.urp-bench]
path = "../crates/urp-bench"

# design 39 §39.6: exporter HTTP parser + netlink-reply decoder fuzz targets.
[dependencies.urp-exporter]
path = "../crates/urp-exporter"

[dependencies.urp-netlink]
path = "../crates/urp-netlink"

[build-dependencies]
cc = "1"

[[bin]]
name = "frame_decode"
path = "fuzz_targets/frame_decode.rs"
doc = false

[[bin]]
name = "frame_roundtrip"
path = "fuzz_targets/frame_roundtrip.rs"
doc = false

[[bin]]
name = "reorder_buffer"
path = "fuzz_targets/reorder_buffer.rs"
doc = false

[[bin]]
name = "reorder_ops"
path = "fuzz_targets/reorder_ops.rs"
doc = false

[[bin]]
name = "credit_state_machine"
path = "fuzz_targets/credit_state_machine.rs"
doc = false

[[bin]]
name = "bench_frame_decode"
path = "fuzz_targets/bench_frame_decode.rs"
doc = false

[[bin]]
name = "bench_differential"
path = "fuzz_targets/bench_differential.rs"
doc = false

[[bin]]
name = "fuzz_http_request"
path = "fuzz_targets/fuzz_http_request.rs"
doc = false

[[bin]]
name = "fuzz_netlink_reply"
path = "fuzz_targets/fuzz_netlink_reply.rs"
doc = false

[workspace]
members = ["."]
